rules:
  - id: study.env-read
    languages: [python]
    message: environment read
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: os.environ.get($KEY, ...)
          - pattern: os.environ.get($KEY)
          - pattern: os.getenv($KEY, ...)
          - pattern: os.getenv($KEY)
          - pattern: os.environ[$KEY]

  - id: study.durable-write
    languages: [python]
    message: durable write
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: $P.write_text(...)
          - pattern: $P.write_bytes(...)
          - pattern: $SRC.replace($DST)
          - pattern: os.open(...)
          - pattern: os.write(...)
          - pattern: $P.mkdir(...)
